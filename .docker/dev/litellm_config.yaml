# LiteLLM Configuration for AFFiNE
# Documentation: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # ============================================
  # AWS Bedrock - Claude Models
  # ============================================
  # Claude 4.5 Sonnet (Latest)
  - model_name: claude-4-5-sonnet
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
    model_info:
      mode: chat
      supports_vision: true
      supports_function_calling: true

  # Claude 4.5 Haiku (Latest)
  - model_name: claude-4-5-haiku
    litellm_params:
      model: bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
    model_info:
      mode: chat
      supports_vision: true
      supports_function_calling: true

  # Claude 3.5 Sonnet
  - model_name: claude-3-5-sonnet
    litellm_params:
      model: bedrock/anthropic.claude-3-5-sonnet-20240620-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
    model_info:
      mode: chat
      supports_vision: true
      supports_function_calling: true

  - model_name: claude-3-opus
    litellm_params:
      model: bedrock/anthropic.claude-3-opus-20240229-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
    model_info:
      mode: chat
      supports_vision: true

  - model_name: claude-3-sonnet
    litellm_params:
      model: bedrock/anthropic.claude-3-sonnet-20240229-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
    model_info:
      mode: chat
      supports_vision: true

  - model_name: claude-3-haiku
    litellm_params:
      model: bedrock/anthropic.claude-3-haiku-20240307-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
    model_info:
      mode: chat
      supports_vision: true

  # ============================================
  # Google Gemini - Fallback Models
  # ============================================
  # Gemini 2.5 Flash (Fallback para quando Bedrock falhar)
  - model_name: gemini-2-5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: chat
      supports_vision: true
      supports_function_calling: true

  # ============================================
  # Google Gemini - Embedding Models
  # ============================================
  # Text Embedding 004 (Most economical - FREE tier available)
  # Dimensions: 768 (default) - can be configured
  # FREE: 1,500 requests per day
  # Paid: $0.00001 per 1K characters (~$0.000025 per 1K tokens)
  # IMPORTANTE: Usando nome "text-embedding-ada-002" para compatibilidade com AFFiNE
  - model_name: text-embedding-ada-002
    litellm_params:
      model: gemini/text-embedding-004
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: embedding
      input_cost_per_token: 0.000000025  # $0.000025 per 1K tokens
      output_dimensions: 768
  
  # Alias alternativo
  - model_name: text-embedding-004
    litellm_params:
      model: gemini/text-embedding-004
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: embedding
      input_cost_per_token: 0.000000025
      output_dimensions: 768
  
  # Gemini embedding model alias (AFFiNE default when no override)
  - model_name: gemini-embedding-001
    litellm_params:
      model: gemini/text-embedding-004
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: embedding
      input_cost_per_token: 0.000000025
      output_dimensions: 768

  # ============================================
  # AWS Bedrock - Titan Embeddings (BACKUP)
  # ============================================
  # Titan Embed Text v2 (Backup - mais caro que Gemini)
  - model_name: titan-embed-text
    litellm_params:
      model: bedrock/amazon.titan-embed-text-v2:0
      aws_region_name: os.environ/AWS_REGION_NAME
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
    model_info:
      mode: embedding
      input_cost_per_token: 0.0000001  # $0.0001 per 1K tokens (4x mais caro)
      output_dimensions: 1024

  # Titan Embed Text v1 (Fallback)
  - model_name: titan-embed-text-v1
    litellm_params:
      model: bedrock/amazon.titan-embed-text-v1
      aws_region_name: os.environ/AWS_REGION_NAME
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
    model_info:
      mode: embedding
      output_dimensions: 1024

  # ============================================
  # Other AWS Bedrock Embedding Models (NOT COMPATIBLE)
  # ============================================
  # These models are NOT compatible with AFFiNE because:
  # - AFFiNE requires exactly 1024 dimensions
  # - AFFiNE only supports text embeddings (not multimodal)
  #
  # Amazon Nova Multimodal Embeddings v1
  # - Dimensions: 1024 (compatible!) BUT multimodal (text + images)
  # - AFFiNE doesn't support multimodal embeddings yet
  # - model: bedrock/amazon.nova-2-multimodal-embeddings-v1:0
  #
  # Titan Embed Image v1
  # - Dimensions: 1024 (compatible!) BUT image-only
  # - AFFiNE needs text embeddings, not image
  # - model: bedrock/amazon.titan-embed-image-v1
  #
  # Cohere Embed English/Multilingual
  # - Dimensions: 1024 (compatible!)
  # - Could work but Titan is AWS native and cheaper
  # - model: bedrock/cohere.embed-english-v3
  # - model: bedrock/cohere.embed-multilingual-v3

  # ============================================
  # OpenAI Models (if you want to use OpenAI too)
  # Uncomment and add OPENAI_API_KEY to .env
  # ============================================
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY
  #   model_info:
  #     mode: chat
  #     supports_vision: true
  #     supports_function_calling: true

  # - model_name: gpt-4o-mini
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY
  #   model_info:
  #     mode: chat

# ============================================
# Router Settings
# ============================================
router_settings:
  routing_strategy: simple-shuffle  # Load balance between models
  num_retries: 0  # Sem retries - vai direto para fallback
  timeout: 600  # 10 minutes
  retry_after: 0  # Sem espera antes de fallback
  allowed_fails: 1  # Apenas 1 falha antes de cooldown
  cooldown_time: 300  # 5 minutos de cooldown para o modelo que falhou
  
  fallbacks:
    # Chat models fallbacks - Bedrock -> Gemini (imediato)
    - claude-4-5-sonnet: [gemini-2-5-flash]
    - claude-4-5-haiku: [gemini-2-5-flash]
    - claude-3-5-sonnet: [gemini-2-5-flash]
    - claude-3-opus: [gemini-2-5-flash]
    - claude-3-sonnet: [gemini-2-5-flash]
    - claude-3-haiku: [gemini-2-5-flash]
    # Embedding models fallbacks - Gemini -> Bedrock
    - text-embedding-ada-002: [titan-embed-text]
    - text-embedding-004: [titan-embed-text]
    - gemini-embedding-001: [titan-embed-text]
  
  # Fallback específico para erros de context window (limite de tokens)
  context_window_fallbacks:
    - claude-4-5-sonnet: [gemini-2-5-flash]
    - claude-4-5-haiku: [gemini-2-5-flash]
    - claude-3-5-sonnet: [gemini-2-5-flash]
    - claude-3-opus: [gemini-2-5-flash]
    - claude-3-sonnet: [gemini-2-5-flash]
    - claude-3-haiku: [gemini-2-5-flash]

# ============================================
# General Settings
# ============================================
general_settings:
  # Master key for authentication (from environment)
  master_key: os.environ/LITELLM_MASTER_KEY
  
  # Database for tracking usage, keys, etc
  database_url: os.environ/DATABASE_URL
  
  # Store model in db - enables usage tracking per model
  store_model_in_db: true
  
  # Enable detailed logging
  json_logs: true

# ============================================
# LiteLLM Settings
# ============================================
litellm_settings:
  # Drop unsupported parameters instead of failing
  drop_params: true
  
  # Set default max tokens
  max_tokens: 4096
  
  # Enable streaming
  stream: true
  
  # Return full response (important for compatibility)
  return_response_headers: true
  
  # Enable caching (optional - requires Redis)
  # cache: true
  # cache_params:
  #   type: redis
  #   host: redis
  #   port: 6379
  
  # Success callbacks for logging (optional)
  # success_callback: ["langfuse"]
  
  # Failure callbacks (optional)
  # failure_callback: ["sentry"]

# ============================================
# Environment Variables (optional)
# ============================================
environment_variables:
  LITELLM_LOG: os.environ/LITELLM_LOG

# ============================================
# Virtual Keys / Team Management (optional)
# Uncomment to enable team-based access control
# ============================================
# Example: Create virtual keys for different teams/workspaces
# You can manage these via LiteLLM Admin UI or API
# 
# To create a key for a specific workspace:
# curl -X POST http://localhost:4000/key/generate \
#   -H "Authorization: Bearer sk-affine-dev-key" \
#   -H "Content-Type: application/json" \
#   -d '{
#     "models": ["claude-3-5-sonnet", "claude-3-haiku"],
#     "max_budget": 100,
#     "budget_duration": "30d",
#     "metadata": {"workspace_id": "workspace-123"}
#   }'
