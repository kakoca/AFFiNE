# LiteLLM Configuration for AFFiNE
# Documentation: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # ============================================
  # AWS Bedrock - Claude Models
  # ============================================
  - model_name: claude-3-5-sonnet
    litellm_params:
      model: bedrock/anthropic.claude-3-5-sonnet-20240620-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
    model_info:
      mode: chat
      supports_vision: true
      supports_function_calling: true

  - model_name: claude-3-opus
    litellm_params:
      model: bedrock/anthropic.claude-3-opus-20240229-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
    model_info:
      mode: chat
      supports_vision: true

  - model_name: claude-3-sonnet
    litellm_params:
      model: bedrock/anthropic.claude-3-sonnet-20240229-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
    model_info:
      mode: chat
      supports_vision: true

  - model_name: claude-3-haiku
    litellm_params:
      model: bedrock/anthropic.claude-3-haiku-20240307-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
    model_info:
      mode: chat
      supports_vision: true

  # ============================================
  # AWS Bedrock - Titan Embeddings
  # ============================================
  - model_name: titan-embed-text
    litellm_params:
      model: bedrock/amazon.titan-embed-text-v1
      aws_region_name: os.environ/AWS_REGION_NAME
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
    model_info:
      mode: embedding

  # ============================================
  # OpenAI Models (if you want to use OpenAI too)
  # Uncomment and add OPENAI_API_KEY to .env
  # ============================================
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY
  #   model_info:
  #     mode: chat
  #     supports_vision: true
  #     supports_function_calling: true

  # - model_name: gpt-4o-mini
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY
  #   model_info:
  #     mode: chat

# ============================================
# Router Settings
# ============================================
router_settings:
  routing_strategy: simple-shuffle  # Load balance between models
  num_retries: 3
  timeout: 600  # 10 minutes
  fallbacks:
    - claude-3-5-sonnet: [claude-3-sonnet, claude-3-haiku]
    - claude-3-opus: [claude-3-5-sonnet, claude-3-sonnet]

# ============================================
# General Settings
# ============================================
general_settings:
  # Master key for authentication (from environment)
  master_key: os.environ/LITELLM_MASTER_KEY
  
  # Database for tracking usage, keys, etc
  database_url: os.environ/DATABASE_URL
  
  # Store model in db - enables usage tracking per model
  store_model_in_db: true
  
  # Enable detailed logging
  json_logs: true

# ============================================
# LiteLLM Settings
# ============================================
litellm_settings:
  # Drop unsupported parameters instead of failing
  drop_params: true
  
  # Set default max tokens
  max_tokens: 4096
  
  # Enable caching (optional - requires Redis)
  # cache: true
  # cache_params:
  #   type: redis
  #   host: redis
  #   port: 6379
  
  # Success callbacks for logging (optional)
  # success_callback: ["langfuse"]
  
  # Failure callbacks (optional)
  # failure_callback: ["sentry"]

# ============================================
# Environment Variables (optional)
# ============================================
environment_variables:
  LITELLM_LOG: os.environ/LITELLM_LOG

# ============================================
# Virtual Keys / Team Management (optional)
# Uncomment to enable team-based access control
# ============================================
# Example: Create virtual keys for different teams/workspaces
# You can manage these via LiteLLM Admin UI or API
# 
# To create a key for a specific workspace:
# curl -X POST http://localhost:4000/key/generate \
#   -H "Authorization: Bearer sk-affine-dev-key" \
#   -H "Content-Type: application/json" \
#   -d '{
#     "models": ["claude-3-5-sonnet", "claude-3-haiku"],
#     "max_budget": 100,
#     "budget_duration": "30d",
#     "metadata": {"workspace_id": "workspace-123"}
#   }'
